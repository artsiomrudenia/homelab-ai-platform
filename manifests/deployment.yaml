apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-ai-platform
  labels:
    app: homelab-ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-ai-platform
  template:
    metadata:
      labels:
        app: homelab-ai-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/artsiomrudenia/homelab-ai-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-ai-platform
spec:
  selector:
    app: homelab-ai-platform
  ports:
    - name: http
      port: 80
      targetPort: 8080
